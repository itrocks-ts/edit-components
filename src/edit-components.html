<!--caption?-->
<label id="{id}-label">{caption}</label>
<!--end-->
<fieldset class="edit-components" id="{id}" data-row-token="{rowToken}"
	data-if="{caption}" aria-labelledby="{id}-label" data-end
>
	{./table.html}
	<input type="hidden" name="{name}._present" value="1">
	<div class="component-actions" inert>
		<div>
			<button class="action" type="button" data-remove-rows="{removeRows}">{removeRow}</button>
		</div>
	</div>
	<template>
		<!--template-->
		{./row.html}
		<!--end-->
	</template>
</fieldset>

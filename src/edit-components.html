<!--caption?-->
<label id="{id}-label">{caption}</label>
<!--end-->
<fieldset class="edit-components" id="{id}" data-row-token="{rowToken}"
	data-if="{caption}" aria-labelledby="{id}-label" data-end
>
	{./table.html}
	<input type="hidden" name="{name}._present" value="1">
	<div class="component-actions">
		<button class="action delete" type="button" data-remove-rows hidden>{removeRows}</button>
		<button class="action new" type="button" data-add-row aria-label="{addRow}" title="{addRow}"></button>
	</div>
	<template>
		<!--template-->
		{./row.html}
		<!--end-->
	</template>
</fieldset>
